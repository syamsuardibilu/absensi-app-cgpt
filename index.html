<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoo Landing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f1f1f1;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .cta {
            margin-top: 20px;
        }
        .cta button {
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .cta button:hover {
            background: #45a049;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Zoo</h1>
        <p>Explore the wonders of wildlife</p>
    </header>
    <div class="content">
        <p>Discover our diverse collection of animals and interactive exhibits.</p>
        <div class="cta">
            <button onclick="alert('Thank you for your interest!')">Learn More</button>
        </div>
    </div>
    <footer>
        &copy; 2023 Zoo Landing Page
    </footer>
</body>
</html>
